<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<style>{{CSS}}</style>
</head>
<body data-mode="both">

<div id="progress"></div>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#top">EN <b>/</b> 中 · 逐句对照阅读</a>
    <div class="ctrls">
      <div class="seg" id="modeSeg" role="group" aria-label="显示模式">
        <button data-mode="both" class="on">双语</button>
        <button data-mode="en">EN</button>
        <button data-mode="zh">中</button>
      </div>
      <div class="seg" id="fontSeg" role="group" aria-label="字号">
        <button id="fMinus" aria-label="缩小字号">A−</button>
        <button id="fPlus" aria-label="放大字号">A+</button>
      </div>
      <button id="tocBtn" class="pill" aria-haspopup="true">目录</button>
    </div>
  </div>
</header>

<main id="top">
{{MAIN}}
</main>

<div id="card" class="card" role="tooltip" aria-hidden="true"></div>

<div id="lb" class="lb" aria-hidden="true">
  <div class="lb-bar"><span id="lbCap"></span><button id="lbClose">关闭（ESC）</button></div>
  <div class="lb-scroll"><img id="lbImg" alt=""></div>
</div>

<div id="toc" class="toc" aria-hidden="true">
  <div class="toc-bg" data-close></div>
  <nav class="toc-panel"><h3>目录</h3>{{TOC}}</nav>
</div>

<script>window.CARDS={{CARDS}};</script>
<script>{{JS}}</script>
</body>
</html>
